<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2A3F"/>
      <stop offset="100%" stop-color="#0B3556"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer scan/target ring (lesion-screening motif) -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#5FA8C2" stroke-width="2.4" opacity="0.55"/>

  <!-- Corner scan brackets -->
  <path d="M14 20 V14 H20" fill="none" stroke="#8FC1D6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M50 20 V14 H44" fill="none" stroke="#8FC1D6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M14 44 V50 H20" fill="none" stroke="#8FC1D6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M50 44 V50 H44" fill="none" stroke="#8FC1D6" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Pulse / heartbeat line -->
  <path d="M10 33 H23 L27 24 L33 42 L37 33 L41 33 L44.5 27 L48 33 H54"
        fill="none" stroke="#FFFFFF" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent pulse dot -->
  <circle cx="44.5" cy="27" r="3.4" fill="#E63946"/>
</svg>
